name: Deploy Eva Games (staging)

on:
  push:
    branches: [rewrite]
    paths:
      - 'app/**'
      - '.github/workflows/deploy-staging.yml'
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Test, migrate and deploy
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

      - name: Apply D1 migrations and deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_STAGING_API_TOKEN }}
          accountId: ${{ secrets.CF_STAGING_ACCOUNT_ID }}
          workingDirectory: app
          command: |
            d1 migrations apply eva-games-staging --remote
            deploy
